<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Post | Yamin</title>

    <style>
        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(255, 255, 255, 0.18),
                    transparent 30%
                ),
                linear-gradient(135deg, #667eea, #764ba2);
            color: #333;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 16px 50px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);

            position: sticky;
            top: 0;
            z-index: 100;
        }


        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #667eea;
            text-decoration: none;
            letter-spacing: -0.5px;
        }


        .menu {
            display: flex;
            align-items: center;
            gap: 30px;
            list-style: none;
        }


        .menu a {
            position: relative;

            text-decoration: none;
            color: #444;

            font-size: 15px;
            font-weight: 600;

            transition: color 0.3s ease;
        }


        .menu a::after {
            content: "";

            position: absolute;
            left: 0;
            bottom: -7px;

            width: 0;
            height: 2px;

            background: #667eea;

            transition: width 0.3s ease;
        }


        .menu a:hover {
            color: #667eea;
        }


        .menu a:hover::after {
            width: 100%;
        }


        .logout-btn {
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            text-decoration: none;

            padding: 10px 20px;

            border-radius: 9px;

            font-size: 14px;
            font-weight: 700;

            transition: all 0.3s ease;
        }


        .logout-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 7px 18px
                rgba(102, 126, 234, 0.35);
        }


        /* =========================
           PAGE
        ========================= */

        .page-wrapper {
            width: 100%;
            max-width: 760px;

            margin: 0 auto;

            padding: 45px 20px 60px;
        }


        /* =========================
           PAGE TITLE
        ========================= */

        .page-title {
            text-align: center;
            color: white;

            margin-bottom: 30px;
        }


        .page-title h1 {
            font-size: 34px;
            font-weight: 800;

            margin-bottom: 8px;
        }


        .page-title p {
            color: rgba(255, 255, 255, 0.85);

            font-size: 14px;
        }


        /* =========================
           CREATE POST CARD
        ========================= */

        .post-container {
            width: 100%;

            background: rgba(255, 255, 255, 0.98);

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 18px 45px
                rgba(0, 0, 0, 0.16);
        }


        /* =========================
           CARD HEADER
        ========================= */

        .post-header {
            display: flex;
            align-items: center;
            gap: 14px;

            margin-bottom: 25px;

            padding-bottom: 20px;

            border-bottom: 1px solid #eee;
        }


        .post-icon {
            width: 52px;
            height: 52px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            border-radius: 14px;

            font-size: 24px;

            box-shadow:
                0 7px 16px
                rgba(102, 126, 234, 0.25);
        }


        .post-header-text h2 {
            color: #222;

            font-size: 21px;

            margin-bottom: 4px;
        }


        .post-header-text p {
            color: #999;

            font-size: 13px;
        }


        /* =========================
           DJANGO FORM
        ========================= */

        .post-form p {
            margin-bottom: 18px;

            display: flex;
            flex-direction: column;
        }


        .post-form label {
            margin-bottom: 8px;

            color: #444;

            font-size: 14px;
            font-weight: 700;
        }


        .post-form input,
        .post-form textarea,
        .post-form select {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            background: #fafafa;

            color: #333;

            transition: all 0.3s ease;
        }


        .post-form textarea {
            min-height: 140px;

            resize: vertical;

            line-height: 1.6;
        }


        .post-form input:focus,
        .post-form textarea:focus,
        .post-form select:focus {
            background: white;

            border-color: #667eea;

            box-shadow:
                0 0 0 4px
                rgba(102, 126, 234, 0.12);
        }


        /* =========================
           IMAGE UPLOAD
        ========================= */

        .post-form input[type="file"] {
            padding: 11px;

            background: #f7f7ff;

            border: 2px dashed #c8cdf5;

            cursor: pointer;

            color: #777;
        }


        .post-form input[type="file"]:hover {
            border-color: #667eea;

            background: #f0f2ff;
        }


        .post-form input[type="file"]::file-selector-button {
            border: none;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            padding: 9px 14px;

            border-radius: 7px;

            margin-right: 12px;

            cursor: pointer;

            font-weight: 600;
        }


        /* =========================
           HELP TEXT
        ========================= */

        .helptext {
            display: block;

            margin-top: 6px;

            color: #888;

            font-size: 12px;

            line-height: 1.5;
        }


        /* =========================
           ERRORS
        ========================= */

        .post-form .errorlist {
            display: block;

            list-style: none;

            padding: 0;

            margin: 0 0 7px;

            color: #dc3545;

            font-size: 12px;
        }


        .post-form .errorlist li {
            margin-bottom: 3px;
        }


        /* =========================
           PUBLISH BUTTON
        ========================= */

        .post-btn {
            width: 100%;

            padding: 14px;

            margin-top: 4px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: all 0.3s ease;
        }


        .post-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 9px 20px
                rgba(102, 126, 234, 0.35);
        }


        .post-btn:active {
            transform: translateY(0);
        }


        /* =========================
           FORM FOOTER
        ========================= */

        .form-footer {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 6px;

            margin-top: 15px;

            color: #999;

            font-size: 12px;
        }


        .form-footer span {
            color: #667eea;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 15px 20px;

                flex-wrap: wrap;

                gap: 15px;
            }


            .logo {
                font-size: 22px;
            }


            .menu {
                order: 3;

                width: 100%;

                justify-content: center;

                gap: 20px;
            }


            .menu a {
                font-size: 14px;
            }


            .logout-btn {
                padding: 8px 14px;

                font-size: 13px;
            }


            .page-wrapper {
                padding: 30px 15px 45px;
            }


            .page-title h1 {
                font-size: 28px;
            }


            .post-container {
                padding: 24px 20px;

                border-radius: 15px;
            }


            .post-header {
                margin-bottom: 22px;
            }


            .post-header-text h2 {
                font-size: 19px;
            }
        }


        @media (max-width: 400px) {

            .menu {
                gap: 13px;
            }


            .menu a {
                font-size: 13px;
            }


            .page-title h1 {
                font-size: 25px;
            }


            .post-container {
                padding: 22px 17px;
            }


            .post-icon {
                width: 46px;
                height: 46px;

                font-size: 21px;
            }


            .post-header-text h2 {
                font-size: 18px;
            }
        }
       
    </style>
</head>


<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">

        <a href="{% url 'home' %}" class="logo">
            Yamin
        </a>


        <ul class="menu">

            <li>
                <a href="{% url 'home' %}">
                    Home
                </a>
            </li>


            <li>
                <a href="{% url 'posts' %}">
                    Posts
                </a>
            </li>


            <li>
                <a href="{% url 'register' %}">
                    Register
                </a>
            </li>


            <li>
                <a href="{% url 'login' %}">
                    Login
                </a>
            </li>

        </ul>


        <a href="{% url 'logout' %}" class="logout-btn">
            Logout
        </a>

    </nav>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="page-wrapper">


        <!-- PAGE TITLE -->

        <div class="page-title">

            <h1>Create a Post</h1>

            <p>
                Share your thoughts with the community
            </p>

        </div>


        <!-- =========================
             POST CARD
        ========================= -->

        <section class="post-container">


            <!-- CARD HEADER -->

            <div class="post-header">

                <div class="post-icon">
                    ✍️
                </div>


                <div class="post-header-text">

                    <h2>
                        Create a New Post
                    </h2>

                    <p>
                        Write something and share it with everyone
                    </p>

                </div>

            </div>


            <!-- =========================
                 FORM

                 IMPORTANT:
                 multipart/form-data is
                 required for image upload.
            ========================= -->

            <form
                method="post"
                enctype="multipart/form-data"
                class="post-form"
            >

                {% csrf_token %}

                {{ form.as_p }}


                <button
                    type="submit"
                    class="post-btn"
                >
                    🚀 Publish Post
                </button>


                <div class="form-footer">
                    <span>🔒</span>
                    Your post will be shared with the community
                </div>

            </form>

        </section>

    </main>

</body>
</html>
