<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Brand</title>

    <style>
        /* =========================
           RESET
        ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #333;
        }

        /* =========================
           NAVBAR
        ========================= */
        .navbar {
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: 700;
            color: #667eea;
            text-decoration: none;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: 30px;
            list-style: none;
        }

        .menu a {
            position: relative;
            text-decoration: none;
            color: #444;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .menu a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 0;
            height: 2px;
            background: #667eea;
            transition: width 0.3s ease;
        }

        .menu a:hover {
            color: #667eea;
        }

        .menu a:hover::after {
            width: 100%;
        }

        .logout-btn {
            background: #667eea;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #5568d9;
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(102, 126, 234, 0.3);
        }

        /* =========================
           REGISTER SECTION
        ========================= */
        .page-wrapper {
            min-height: calc(100vh - 73px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .register-container {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.98);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2);
        }

        /* =========================
           ICON
        ========================= */
        .register-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 50%;
            font-size: 28px;
        }

        /* =========================
           HEADING
        ========================= */
        h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #222;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        /* =========================
           DJANGO FORM
        ========================= */
        form p {
            margin-bottom: 17px;
            display: flex;
            flex-direction: column;
        }

        form label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-size: 14px;
            font-weight: 600;
        }

        form input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d5d5d5;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            background: #fafafa;
            transition: all 0.3s ease;
        }

        form input:focus {
            background: white;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }

        /* =========================
           DJANGO HELP TEXT
        ========================= */
        .helptext {
            display: block;
            margin-top: 6px;
            color: #888;
            font-size: 11px;
            line-height: 1.5;
        }

        /* =========================
           ERRORS
        ========================= */
        form ul.errorlist {
            display: block;
            list-style: none;
            padding: 0;
            margin: 0 0 7px;
            color: #dc3545;
            font-size: 12px;
        }

        form ul.errorlist li {
            margin-bottom: 3px;
        }

        /* =========================
           REGISTER BUTTON
        ========================= */
        .register-btn {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(102, 126, 234, 0.35);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        /* =========================
           LOGIN LINK
        ========================= */
        .login-link {
            text-align: center;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #777;
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* =========================
           MOBILE
        ========================= */
        @media (max-width: 700px) {

            .navbar {
                padding: 15px 20px;
                flex-wrap: wrap;
                gap: 15px;
            }

            .logo {
                font-size: 22px;
            }

            .menu {
                order: 3;
                width: 100%;
                justify-content: center;
                gap: 20px;
            }

            .menu a {
                font-size: 14px;
            }

            .logout-btn {
                padding: 8px 14px;
                font-size: 13px;
            }

            .page-wrapper {
                min-height: calc(100vh - 125px);
                padding: 30px 15px;
            }

            .register-container {
                padding: 30px 22px;
                border-radius: 14px;
            }

            h2 {
                font-size: 24px;
            }
        }

        @media (max-width: 400px) {

            .menu {
                gap: 13px;
            }

            .menu a {
                font-size: 13px;
            }

            .register-container {
                padding: 25px 18px;
            }
        }
        .helptext{
            display: none;
        }
        ul{
            display: none;
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->
    <nav class="navbar">

        <a href="{% url 'home' %}" class="logo">
            Yamin
        </a>

        <ul class="menu">

            <li>
                <a href="{% url 'home' %}">
                    Home
                </a>
            </li>

            <li>
                <a href="{% url 'posts' %}">
                    Posts
                </a>
            </li>

            <li>
                <a href="{% url 'register' %}">
                    Register
                </a>
            </li>

            <li>
                <a href="{% url 'login' %}">
                    Login
                </a>
            </li>

        </ul>

        <a href="{% url 'logout' %}" class="logout-btn">
            Logout
        </a>

    </nav>


    <!-- =========================
         REGISTER FORM
    ========================= -->
    <main class="page-wrapper">

        <div class="register-container">

            <div class="register-icon">
                👤
            </div>

            <h2>Create Account</h2>

            <p class="subtitle">
                Join us and create your account
            </p>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="register-btn">
                    Create Account
                </button>

                <div class="login-link">
                    Already registered?
                    <a href="{% url 'login' %}">
                        Sign In
                    </a>
                </div>

            </form>

        </div>

    </main>

</body>
</html>
