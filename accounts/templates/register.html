<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<style>

    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #013e37;
    color: #ffefb3;
}
.form_container{
    background: #ffefb3;
    color : #013e37;
    padding : 20px;
}
   
    .helptext{
        display:none;
    }
    ul{
        color: #013e37;
        background: #ffefb3;
        display:none;
    }
    input{
        width: 400px;
        height: 37px;
        border-radius: 10px;
        margin: 10px;
        font-size: 18px;
    }
    button{
        width:395px ;
        height:40px ;
        background: #013e37;
        color : #ffefb3;
        margin-left: 184px;
        font-size: 20px;
    }
    a{
        margin-left:20px;
    }

</style>


    <div class="form_container">
    <form method="post">
        {% csrf_token %}
        {{form.as_p}}
        <button type='submit'>Register</button>
    </form>

    <p style='color:black; text-align:left;margin-top:20px;'>already registered?   <a href={% url 'login'  %}>Login</a>   <a href={% url 'home'  %}>Home</a> </p>
    </div>
</body>
</html>
